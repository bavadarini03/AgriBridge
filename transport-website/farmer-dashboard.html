<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriBridge — Farmer Dashboard</title>
    <meta name="description"
        content="AgriBridge Farmer Dashboard — Manage crops, view orders, track deliveries, check market prices, and grow your farm business." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="buyer.css" />
    <link rel="stylesheet" href="farmer.css" />
</head>

<body>
    <div class="app-shell">
        <!-- ── Sidebar ──────────────────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <span>Agri<span style="color:#4CAF50;">Bridge</span></span>
                <span style="font-size:0.65rem;color:#aaa;display:block;margin-top:2px;">Farmer Dashboard</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <span>🏠</span><span>Home</span>
                </a>
                <a href="#my-crops" class="nav-item" data-page="my-crops">
                    <span>🌱</span><span>My Crops</span>
                </a>
                <a href="#market-prices" class="nav-item" data-page="market-prices">
                    <span>📈</span><span>Market Prices</span>
                </a>
                <a href="#ai-recommendations" class="nav-item" data-page="ai-recommendations">
                    <span>🤖</span><span>AI Recommendations</span>
                </a>
                <a href="#nearby-buyers" class="nav-item" data-page="nearby-buyers">
                    <span>🏪</span><span>Nearby Buyers</span>
                </a>
                <a href="#orders" class="nav-item" data-page="orders">
                    <span>📦</span><span>My Orders</span>
                </a>
                <a href="#transport" class="nav-item" data-page="transport">
                    <span>🚚</span><span>Transport</span>
                </a>
                <a href="#earnings" class="nav-item" data-page="earnings">
                    <span>💰</span><span>Earnings</span>
                </a>
                <a href="#voice-assistant" class="nav-item" data-page="voice-assistant">
                    <span>🎤</span><span>Voice Assistant</span>
                </a>
                <a href="#profile" class="nav-item" data-page="profile">
                    <span>👤</span><span>Profile</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-danger btn-sm" id="sidebar-logout-btn" style="width:100%;">Logout</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- ── Main area ─────────────────────────────────────────────── -->
        <main class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="sidebar-toggle" type="button">☰</button>
                    <h2 id="page-title">Home</h2>
                </div>
                <div class="topbar-right">
                    <div class="conn-status disconnected" id="connection-status">
                        <span class="conn-dot"></span>
                        <span class="conn-label">Connecting</span>
                    </div>
                    <button class="user-profile" id="profile-menu-btn" type="button">
                        <span class="avatar" id="topbar-avatar-initial">F</span>
                        <span id="topbar-name">Farmer</span>
                    </button>
                    <div class="profile-dropdown" id="profile-dropdown">
                        <a class="dropdown-item" href="#profile"
                            onclick="navigateTo('profile');document.getElementById('profile-dropdown').classList.remove('open');">My
                            Profile</a>
                        <button class="dropdown-item" id="logout-btn" type="button">Logout</button>
                    </div>
                </div>
            </header>

            <section class="page-content">
                <section id="page-dashboard" class="page-section active"></section>
                <section id="page-my-crops" class="page-section"></section>
                <section id="page-add-crop" class="page-section"></section>
                <section id="page-edit-crop" class="page-section"></section>
                <section id="page-market-prices" class="page-section"></section>
                <section id="page-ai-recommendations" class="page-section"></section>
                <section id="page-nearby-buyers" class="page-section"></section>
                <section id="page-orders" class="page-section"></section>
                <section id="page-order-details" class="page-section"></section>
                <section id="page-transport" class="page-section"></section>
                <section id="page-request-transport" class="page-section"></section>
                <section id="page-earnings" class="page-section"></section>
                <section id="page-voice-assistant" class="page-section"></section>
                <section id="page-profile" class="page-section"></section>
            </section>
        </main>
    </div>

    <!-- Loading overlay -->
    <div id="auth-loading"
        style="position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="font-size:48px;margin-bottom:16px;">🌱</div>
        <div style="font-size:1.2rem;font-weight:600;color:#333;">AgriBridge</div>
        <div style="color:#888;margin-top:8px;">Loading your farmer dashboard...</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>

    <!-- Core services -->
    <script src="firebase-config.js"></script>
    <script src="firebase-service.js"></script>
    <script src="utils.js"></script>

    <!-- Farmer module (order: page modules → aggregator → app) -->
    <script src="farmer-pages-core.js"></script>
    <script src="farmer-pages-orders.js"></script>
    <script src="farmer-pages-market.js"></script>
    <script src="farmer-pages-misc.js"></script>
    <script src="farmer-pages.js"></script>
    <script src="farmer-app.js"></script>

    <script>
        window._hideAuthLoading = function () {
            const el = document.getElementById('auth-loading');
            if (el) el.style.display = 'none';
        };
    </script>
</body>

</html>
