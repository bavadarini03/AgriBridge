<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriBridge Transport Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo"><span>AgriBridge <span class="highlight">Transport</span></span></div>
      <nav class="sidebar-nav">
        <a href="#dashboard"     class="nav-item active" data-page="dashboard">    <span>Dashboard</span></a>
        <a href="#requests"      class="nav-item"        data-page="requests">     <span>Transport Requests</span></a>
        <a href="#active"        class="nav-item"        data-page="active">       <span>Active Delivery</span></a>
        <a href="#tracking"      class="nav-item"        data-page="tracking">     <span>Live Tracking</span></a>
        <a href="#history"       class="nav-item"        data-page="history">      <span>Delivery History</span></a>
        <a href="#earnings"      class="nav-item"        data-page="earnings">     <span>Earnings</span></a>
        <a href="#vehicle"       class="nav-item"        data-page="vehicle">      <span>Vehicle</span></a>
        <a href="#notifications" class="nav-item"        data-page="notifications"><span>Notifications</span></a>
        <a href="#profile"       class="nav-item"        data-page="profile">      <span>Profile</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="text-small text-muted">Vehicle</div>
        <div id="sidebar-vehicle" style="margin-top:4px;">Not set</div>
        <button class="btn btn-danger btn-sm" id="sidebar-logout-btn" style="margin-top:12px; width:100%;">Logout</button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="sidebar-toggle" type="button">Menu</button>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="topbar-right">
          <div class="conn-status disconnected" id="connection-status">
            <span class="conn-dot"></span>
            <span class="conn-label">Connecting</span>
          </div>
          <button class="notification-bell" id="notif-btn" type="button" aria-label="Notifications">
            Notifications <span class="badge-new" id="notif-badge" style="display:none;"></span>
          </button>
          <button class="user-profile" id="profile-menu-btn" type="button">
            <span class="avatar" id="topbar-avatar-initial">D</span>
            <span id="topbar-name">Driver</span>
          </button>
          <div class="profile-dropdown" id="profile-dropdown">
            <button class="dropdown-item" id="logout-btn" type="button">Logout</button>
          </div>
        </div>
      </header>

      <section class="page-content">
        <section id="page-dashboard"     class="page-section active"></section>
        <section id="page-requests"      class="page-section"></section>
        <section id="page-active"        class="page-section"></section>
        <section id="page-tracking"      class="page-section"></section>
        <section id="page-history"       class="page-section"></section>
        <section id="page-earnings"      class="page-section"></section>
        <section id="page-vehicle"       class="page-section"></section>
        <section id="page-notifications" class="page-section"></section>
        <section id="page-profile"       class="page-section"></section>
      </section>
    </main>
  </div>

  <!-- Leaflet maps (kept — unchanged) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK (v9 compat — replaces Socket.IO) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- App config & service layer (must load before api.js / socket.js) -->
  <script src="firebase-config.js?v=20260912"></script>
  <script src="firebase-service.js?v=20260912"></script>

  <!-- Core app utilities & shims -->
  <script src="utils.js?v=20260912"></script>
  <script src="api.js?v=20260912"></script>
  <script src="socket.js?v=20260912"></script>
  <script src="app.js?v=20260912"></script>

  <!-- Page modules (unchanged) -->
  <script src="dashboard.js?v=20260912"></script>
  <script src="requests.js?v=20260912"></script>
  <script src="delivery.js?v=20260912"></script>
  <script src="tracking.js?v=20260912"></script>
  <script src="history.js?v=20260912"></script>
  <script src="earnings.js?v=20260912"></script>
  <script src="vehicle.js?v=20260912"></script>
  <script src="notifications.js?v=20260912"></script>
  <script src="profile.js?v=20260912"></script>
</body>
</html>
